name: Daily collections run

on:
  schedule:
    - cron: "17 2 * * *"       # about 07:17 Pakistan time, every day
    - cron: "41 3 1 * *"       # monthly keep-alive (GitHub pauses schedules after 60 quiet days)
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test SQL logic
        run: python -m unittest discover -s tests -v

      - name: Run pipeline for yesterday (Pakistan time)
        run: python -m src.run_pipeline --out site

      - name: Post the CEO brief to the run summary
        run: cat site/ceo_brief.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event.schedule == '41 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit so the daily schedule stays active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly keep-alive"
          git push
